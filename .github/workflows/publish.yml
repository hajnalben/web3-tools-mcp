name: Publish

# Releasing is pushing a vX.Y.Z tag. Both packages carry that one version. They are staged on
# npm through trusted publishing, with no token stored anywhere, and go live once a
# maintainer approves each with 2FA on npmjs.com — the relay first, as the server pins it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: npm ci

      - name: Tag matches the packages' version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./mcp/package.json').version")"

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          HYPERSYNC_API_KEY: ${{ secrets.HYPERSYNC_API_KEY }}
          CI: true

  stage:
    needs: verify
    runs-on: ubuntu-latest
    # The trusted publisher on npm names this environment, which deploys only from v* tags.
    environment: npm
    # Only this job can mint a publish token, and it runs no dependency install scripts.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm install -g npm@11.21.0 # npm stage needs 11.15

      - run: npm stage publish -w web3-wallet-relay

      - run: npm stage publish -w web3-tools-mcp

  # Announced once both packages are staged; they go live on npm when approved. A tag with no
  # CHANGELOG section fails here, after staging, and the job can be rerun once one is added.
  release:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Notes from CHANGELOG.md
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            'index($0, "## [") == 1 { if (on) exit; on = index($0, heading) == 1; next } on' \
            CHANGELOG.md > notes.md
          test -s notes.md

      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
