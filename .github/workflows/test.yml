name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test
      env:
        # Optional. The tests reach live chains, and a public RPC serves only recent
        # state — anything needing historical state, past logs or tracing skips itself
        # when the matching credential is absent, so a fork with no secrets still runs
        # green. Set these as repository secrets for full coverage.
        ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        HYPERSYNC_API_KEY: ${{ secrets.HYPERSYNC_API_KEY }}
        CI: true

    - name: Build
      run: npm run build
