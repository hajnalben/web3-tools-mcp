name: Sync ERC-7730 registry

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Clone the registry
        run: git clone --depth 1 https://github.com/LedgerHQ/clear-signing-erc7730-registry.git /tmp/erc7730

      - name: Rebuild the index
        run: node mcp/scripts/build-erc7730-index.mjs /tmp/erc7730/registry mcp/src/erc7730-index.json.gz

      - name: Open a PR when descriptors changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          add-paths: mcp/src/erc7730-index.json.gz
          branch: sync/erc7730
          commit-message: 'chore(clear-signing): refresh the ERC-7730 index'
          title: 'chore(clear-signing): refresh the ERC-7730 index'
          body: |
            Rebuilt from the Ledger clear-signing registry.

            Review the diff before merging — these descriptors decide what a signer is
            told a transaction does.
