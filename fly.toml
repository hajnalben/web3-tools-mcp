# Fly.io deployment for the MCP server. Signing happens on a phone over WalletConnect —
# a hosted server has no browser to open.
#
#   fly launch --no-deploy --copy-config    # pick a name and region
#   fly volumes create data --size 1
#   fly secrets set MCP_TOKEN=$(openssl rand -hex 24) WALLETCONNECT_PROJECT_ID=<id>
#   fly deploy
#
# Then point an MCP client at https://<app>.fly.dev/mcp with that token as a bearer header.

app = 'web3-tools-mcp'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  MCP_HTTP_PORT = '8080'
  # The WalletConnect pairing lives here, on the volume, so it survives deploys.
  XDG_CONFIG_HOME = '/data'

# Keeps the pairing across restarts and redeploys. Only one machine may mount it, which is
# what we want anyway: two machines would hold two unrelated WalletConnect sessions.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Never stop the machine. Suspending drops the WalletConnect relay socket the phone
  # pairing depends on, so a transaction sent afterwards waits on a cold start instead of
  # reaching the phone.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
