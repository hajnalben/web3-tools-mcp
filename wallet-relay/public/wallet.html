<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Transaction Signing — Web3 Tools</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #f4f6f8;
            --border: #e2e6ea;
            --border-strong: #ced5dd;

            --text: #101620;
            --text-2: #58626f;
            --text-3: #66707d;

            --accent: #3856d6;
            --accent-hover: #2c45b4;
            --accent-fg: #ffffff;
            --accent-soft: #eef1fe;

            --ok-fg: #0d7a45;
            --ok-bg: #eaf7f0;
            --ok-border: #bce3cd;

            --danger-fg: #b3251d;
            --danger-bg: #fdeeec;
            --danger-border: #f4c6c2;
            --danger-solid: #c0392b;
            --danger-solid-hover: #a33023;

            --warn-fg: #8a5a00;
            --warn-bg: #fdf6e7;
            --warn-border: #efdcae;

            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 2px 8px rgba(16, 24, 40, 0.06);

            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        body.dark-mode {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #1b212a;
            --border: #262d38;
            --border-strong: #38414f;

            --text: #e6edf3;
            --text-2: #9aa5b1;
            --text-3: #828c99;

            --accent: #7d97ff;
            --accent-hover: #93a9ff;
            /* The dark accent is light, so anything sitting on it needs dark ink. */
            --accent-fg: #10161f;
            --accent-soft: rgba(125, 151, 255, 0.12);

            --ok-fg: #5ed39a;
            --ok-bg: rgba(46, 160, 97, 0.14);
            --ok-border: rgba(94, 211, 154, 0.26);

            --danger-fg: #ff9a92;
            --danger-bg: rgba(248, 81, 73, 0.13);
            --danger-border: rgba(255, 154, 146, 0.26);
            --danger-solid: #c9392b;
            --danger-solid-hover: #e04434;

            --warn-fg: #f0c36d;
            --warn-bg: rgba(187, 128, 9, 0.14);
            --warn-border: rgba(240, 195, 109, 0.26);

            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            transition: background 0.2s, color 0.2s;
        }

        .app {
            max-width: 620px;
            margin: 0 auto;
            padding: calc(32px + env(safe-area-inset-top, 0px)) 20px calc(64px + env(safe-area-inset-bottom, 0px));
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: block;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-3);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-2);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background: var(--surface-2);
            color: var(--text);
            border-color: var(--border-strong);
        }

        /* Theme toggle swaps icons via the body class, so no script touches its contents */
        body:not(.dark-mode) .icon-sun,
        body.dark-mode .icon-moon {
            display: none;
        }

        /* Chain badge */
        .chain-badge {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s, background 0.15s;
        }

        .chain-badge:hover,
        .chain-badge.open {
            border-color: var(--border-strong);
            background: var(--surface-2);
        }

        .chain-badge.connected {
            color: var(--text);
        }

        .chain-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-3);
            flex-shrink: 0;
        }

        .chain-indicator.active {
            background: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
        }

        .chain-arrow {
            font-size: 9px;
            color: var(--text-3);
            transition: transform 0.15s;
        }

        .chain-badge.open .chain-arrow {
            transform: rotate(180deg);
        }

        .chain-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 20;
            min-width: 200px;
            max-height: 320px;
            overflow-y: auto;
            padding: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
        }

        .chain-dropdown.show {
            display: block;
        }

        .chain-option {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            cursor: pointer;
        }

        .chain-option:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .chain-option.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        /* Status banner */
        .status {
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--text-3);
            border-radius: var(--radius-sm);
            background: var(--surface);
            font-size: 13px;
            color: var(--text-2);
        }

        .status strong {
            color: var(--text);
            font-weight: 600;
        }

        .status.success {
            background: var(--ok-bg);
            border-color: var(--ok-border);
            border-left-color: var(--ok-fg);
            color: var(--ok-fg);
        }

        .status.error {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            border-left-color: var(--danger-fg);
            color: var(--danger-fg);
        }

        .status.warning {
            background: var(--warn-bg);
            border-color: var(--warn-border);
            border-left-color: var(--warn-fg);
            color: var(--warn-fg);
        }

        .status.success strong,
        .status.error strong,
        .status.warning strong {
            color: inherit;
        }

        /* Buttons */
        button {
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        #connectBtn {
            display: block;
            width: 100%;
            padding: 13px 20px;
            border: none;
            background: var(--accent);
            color: var(--accent-fg);
        }

        #connectBtn:hover {
            background: var(--accent-hover);
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .card + .card,
        #connectBtn + .card {
            margin-top: 20px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            margin: 0;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .pill {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: var(--warn-bg);
            color: var(--warn-fg);
            border: 1px solid var(--warn-border);
        }

        /* Account summary */
        .wallet-info {
            padding: 6px 18px;
        }

        .info-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-3);
            flex-shrink: 0;
        }

        .info-value {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text);
            text-align: right;
            word-break: break-all;
        }

        /* Transaction request */
        .tx-preview .card-head {
            background: var(--surface-2);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .tx-details {
            padding: 18px;
        }

        .tx-intent {
            font-size: 18px;
            font-weight: 650;
            letter-spacing: -0.01em;
            color: var(--text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tx-protocol {
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 650;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .tx-fn {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 400;
            color: var(--text-3);
        }

        .tx-source {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.01em;
            background: var(--ok-bg);
            color: var(--ok-fg);
            border: 1px solid var(--ok-border);
        }

        .tx-source-guessed {
            background: var(--warn-bg);
            color: var(--warn-fg);
            border-color: var(--warn-border);
        }

        .tx-param {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .tx-param-name {
            font-size: 13px;
            color: var(--text-3);
            flex-shrink: 0;
        }

        .tx-param-value {
            flex: 1;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text);
            text-align: right;
            word-break: break-all;
        }

        .tx-label {
            font-family: var(--font);
            font-weight: 600;
            color: var(--text);
        }

        .tx-link {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px dotted var(--border-strong);
        }

        .tx-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tx-warning {
            flex-basis: 100%;
            margin-top: 6px;
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            color: var(--warn-fg);
            font-size: 12px;
            font-weight: 600;
            text-align: left;
        }

        /* Simulation result */
        .tx-sim {
            margin-top: 16px;
            padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .tx-sim strong {
            display: block;
            font-size: 13px;
            font-weight: 650;
            margin-bottom: 2px;
        }

        .tx-sim-ok {
            background: var(--ok-bg);
            border-color: var(--ok-border);
            color: var(--ok-fg);
        }

        .tx-sim-fail {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-fg);
        }

        .tx-sim-unknown {
            background: var(--warn-bg);
            border-color: var(--warn-border);
            color: var(--warn-fg);
        }

        .tx-sim-note {
            opacity: 0.85;
            margin-top: 4px;
        }

        .tx-assets {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid currentColor;
            border-top-color: color-mix(in srgb, currentColor 22%, transparent);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tx-asset {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            font-family: var(--mono);
            font-size: 12px;
        }

        .tx-asset-amount {
            font-weight: 600;
            white-space: nowrap;
        }

        .tx-asset-out .tx-asset-amount {
            color: var(--danger-fg);
        }

        .tx-asset-in .tx-asset-amount {
            color: var(--ok-fg);
        }

        /* Transfers between third parties — shown for context, not your balance. */
        .tx-asset-other .tx-asset-amount {
            color: var(--text-3);
        }

        .tx-asset-party {
            opacity: 0.85;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Approve / reject */
        .tx-actions {
            display: flex;
            gap: 10px;
            padding: 0 18px 18px;
        }

        .tx-actions button {
            flex: 1;
            padding: 12px 16px;
        }

        .btn-approve {
            border: none;
            background: var(--accent);
            color: var(--accent-fg);
        }

        .btn-approve:hover {
            background: var(--accent-hover);
        }

        .btn-approve.btn-danger {
            background: var(--danger-solid);
            color: #ffffff;
        }

        .btn-approve.btn-danger:hover {
            background: var(--danger-solid-hover);
        }

        .btn-reject {
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-2);
        }

        .btn-reject:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        /* History */
        .tx-history {
            margin-top: 32px;
        }

        .section-title {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .tx-history-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--text-3);
            border-radius: var(--radius-sm);
        }

        .tx-history-item.success {
            border-left-color: var(--ok-fg);
        }

        .tx-history-item.failed {
            border-left-color: var(--danger-fg);
        }

        .tx-history-item.pending {
            border-left-color: var(--warn-fg);
        }

        .tx-history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .tx-history-function {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .tx-history-status {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--text-3);
        }

        .tx-history-status.success {
            background: var(--ok-bg);
            color: var(--ok-fg);
        }

        .tx-history-status.failed {
            background: var(--danger-bg);
            color: var(--danger-fg);
        }

        .tx-history-status.pending {
            background: var(--warn-bg);
            color: var(--warn-fg);
        }

        .tx-history-details {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-3);
        }

        .tx-history-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }

        .tx-history-link:hover {
            text-decoration: underline;
        }

        /* Activity log */
        .log-wrap {
            margin-top: 32px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .log-wrap summary {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
            cursor: pointer;
            list-style: none;
        }

        .log-wrap summary::-webkit-details-marker {
            display: none;
        }

        .log-wrap summary::before {
            content: "▸ ";
            font-size: 10px;
        }

        .log-wrap[open] summary::before {
            content: "▾ ";
        }

        .log {
            margin-top: 10px;
            padding: 12px;
            max-height: 220px;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.7;
        }

        .log-entry {
            color: var(--text-2);
        }

        .log-entry.error {
            color: var(--danger-fg);
        }

        .log-entry.success {
            color: var(--ok-fg);
        }

        .log-entry.info {
            color: var(--text-2);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .app {
                padding-left: 16px;
                padding-right: 16px;
            }

            .brand-sub {
                display: none;
            }

            .tx-param-value,
            .info-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <img src="icon.svg" width="36" height="36" alt="">
                </span>
                <div>
                    <div class="brand-name">Web3 Tools</div>
                    <div class="brand-sub">Transaction signing</div>
                </div>
            </div>

            <div class="header-actions">
                <div id="chainBadge" class="chain-badge">
                    <span class="chain-indicator"></span>
                    <span id="chainName">Not connected</span>
                    <span class="chain-arrow">▼</span>
                    <div id="chainDropdown" class="chain-dropdown"></div>
                </div>

                <button type="button" id="notifyBtn" class="icon-btn hidden" title="Get notified about transaction requests" aria-label="Enable notifications">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.7 21a2 2 0 01-3.4 0"/>
                    </svg>
                </button>

                <a href="https://github.com/hajnalben/web3-tools-mcp" target="_blank" rel="noreferrer" class="icon-btn" title="View on GitHub" aria-label="View on GitHub">
                    <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </a>

                <button type="button" id="themeBtn" class="icon-btn dark-mode-toggle" title="Toggle theme" aria-label="Toggle theme">
                    <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
                    </svg>
                    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
                </button>
            </div>
        </header>

        <div id="statusMessage" class="hidden" role="status" aria-live="polite"></div>

        <button type="button" id="connectBtn">Connect wallet</button>

        <section id="walletInfo" class="card wallet-info hidden">
            <div class="info-row">
                <span class="info-label">Address</span>
                <span id="address" class="info-value"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Network</span>
                <span id="networkName" class="info-value"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Balance</span>
                <span id="balance" class="info-value"></span>
            </div>
        </section>

        <section id="txPreview" class="card tx-preview hidden" aria-live="polite">
            <div class="card-head">
                <h2 class="card-title">Transaction requests</h2>
                <span class="pill" id="txCount">Awaiting approval</span>
            </div>
            <!-- One block per waiting request. Each carries its own id, so approving the
                 second never answers the first. -->
            <div id="txRequests"></div>
        </section>

        <section id="txHistory" class="tx-history hidden">
            <h2 class="section-title">Recent transactions</h2>
            <div id="txHistoryList"></div>
        </section>

        <details class="log-wrap">
            <summary>Activity log</summary>
            <div id="log" class="log"></div>
        </details>
    </div>

    <script type="module" src="wallet-app.js"></script>
</body>
</html>
