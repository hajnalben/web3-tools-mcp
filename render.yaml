services:
  - type: web
    name: web3-wallet-relay
    runtime: node
    plan: free
    # Only the relay workspace is installed and built — none of the MCP server's deps.
    rootDir: wallet
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Shared with the MCP server as WALLET_TOKEN — anyone holding it can request signatures.
      - key: WALLET_TOKEN
        generateValue: true
      # Public URL of this service, used to print the pairing link.
      - key: WALLET_PUBLIC_URL
        sync: false
