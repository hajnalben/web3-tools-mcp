services:
  # The MCP server. Signing reaches you on a phone paired over WalletConnect, or in a browser
  # through the signing page this same service hosts at its root — the wallet relay runs
  # in-process, so there is no second service to deploy.
  - type: web
    name: web3-tools-mcp
    runtime: node
    # A paid plan, for two reasons: a free instance sleeps after 15 minutes, and sleeping
    # drops the WalletConnect socket your phone pairing depends on; and free instances cannot
    # attach the disk below.
    plan: starter
    buildCommand: npm install && npm run build
    # Render assigns PORT; MCP_HTTP_PORT is what switches stdio off. RENDER_EXTERNAL_URL is
    # this service's onrender.com URL — set MCP_PUBLIC_URL to use a custom domain instead.
    startCommand: MCP_HTTP_PORT=$PORT MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-$RENDER_EXTERNAL_URL} node mcp/dist/index.js
    healthCheckPath: /health
    # Render's filesystem is ephemeral on every plan, so the WalletConnect pairing needs a
    # disk to survive a redeploy — otherwise you rescan the QR each time. A disk costs a few
    # seconds of downtime per deploy, which is nothing for a personal server. The free Key
    # Value instance is not an alternative: it does not persist either.
    disk:
      name: data
      mountPath: /var/lib/web3-tools-mcp
      sizeGB: 1
    envVars:
      # storePath() honours this, so the pairing lands on the disk above.
      - key: XDG_CONFIG_HOME
        value: /var/lib/web3-tools-mcp
      # Render's proxy sits in front, so the client's address is one X-Forwarded-For hop back.
      - key: MCP_TRUST_PROXY
        value: '1'
      # Required: anyone who reaches /mcp could ask your wallet to sign something.
      - key: MCP_TOKEN
        generateValue: true
      - key: MCP_PUBLIC_URL
        sync: false
      - key: WALLETCONNECT_PROJECT_ID
        sync: false
      # Alternative to the disk, for hosts that have no volumes (or a free plan here).
      # Leave blank to keep the pairing on disk.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
