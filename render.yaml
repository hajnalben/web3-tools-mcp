services:
  - type: web
    name: web3-wallet-relay
    runtime: node
    plan: free
    # Only the relay workspace is installed and built — none of the MCP server's deps.
    rootDir: wallet
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Shared with the MCP server as WALLET_TOKEN — anyone holding it can request signatures.
      - key: WALLET_TOKEN
        generateValue: true
      # Public URL of this service, used to print the pairing link.
      - key: WALLET_PUBLIC_URL
        sync: false

  # The MCP server itself. Only useful together with WalletConnect: a hosted server has no
  # browser to open, so a paired phone is the only way it can get anything signed.
  - type: web
    name: web3-tools-mcp
    runtime: node
    # Starter rather than free: a free instance sleeps after 15 minutes, and sleeping drops
    # the WalletConnect socket your phone pairing depends on. Free works if you accept
    # re-waking (and a ~1 minute cold start) before the first transaction lands.
    plan: starter
    buildCommand: npm install && npm run build
    # Render assigns PORT; MCP_HTTP_PORT is what switches stdio off.
    startCommand: MCP_HTTP_PORT=$PORT node dist/index.js
    healthCheckPath: /health
    # Render's filesystem is ephemeral on every plan, so the WalletConnect pairing needs a
    # disk to survive a redeploy — otherwise you rescan the QR each time. A disk costs a few
    # seconds of downtime per deploy, which is nothing for a personal server. The free Key
    # Value instance is not an alternative: it does not persist either.
    disk:
      name: data
      mountPath: /var/lib/web3-tools-mcp
      sizeGB: 1
    envVars:
      # storePath() honours this, so the pairing lands on the disk above.
      - key: XDG_CONFIG_HOME
        value: /var/lib/web3-tools-mcp
      # Required: anyone who reaches /mcp could ask your phone to sign something.
      - key: MCP_TOKEN
        generateValue: true
      - key: WALLETCONNECT_PROJECT_ID
        sync: false
      # Alternative to the disk, for hosts that have no volumes (or a free plan here).
      # Leave blank to keep the pairing on disk.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
